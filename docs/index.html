<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>SHLS 진입 타이밍 대시보드</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script defer src="assets/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>SHLS 진입 타이밍 대시보드</h1>
        <p>삼성전자 롱 / SK하이닉스 숏 전략 모니터</p>
      </div>
      <div class="status-strip">
        <a class="nav-link" href="base.html">기초자료</a>
        <a class="nav-link" href="research.html">리서치</a>
        <a class="nav-link" href="simulator.html">시뮬레이터</a>
        <a class="nav-link" href="backtest.html">백테스트</a>
        <span id="refreshState" class="pill neutral">로딩</span>
        <span id="generatedAt" class="muted">-</span>
      </div>
    </header>

    <main>
      <section class="summary-grid">
        <article class="score-panel">
          <div class="panel-label label-line">
            진입 점수
            <span class="help" tabindex="0" title="가치 격차, 스프레드 과매도, 반전 확인, 실적 수정, HBM 이벤트, SK하이닉스 둔화 신호를 합산한 0-100점 진입 판단 지표입니다.">?</span>
          </div>
          <div class="score-row">
            <strong id="scoreValue">-</strong>
            <span id="actionLabel" class="pill neutral">-</span>
          </div>
          <div class="bar">
            <span id="scoreBar"></span>
          </div>
          <dl id="scoreComponents" class="component-list"></dl>
        </article>

        <article class="metric-card" title="SK하이닉스 시가총액을 삼성전자 시가총액으로 나눈 값입니다. 20일 평균보다 높은지 함께 봅니다.">
          <span class="label-line">SK/삼성 시총 비율 <span class="help" tabindex="0" title="SK하이닉스 시가총액 / 삼성전자 시가총액입니다. 상대 과열 또는 가치 격차 판단에 사용합니다.">?</span></span>
          <strong id="mcapRatio">-</strong>
          <small id="mcapRatioMa">-</small>
        </article>
        <article class="metric-card" title="삼성전자 롱과 SK하이닉스 숏의 가중 스프레드가 최근 60일 평균 대비 얼마나 벗어났는지 보여줍니다.">
          <span class="label-line">스프레드 Z값 <span class="help" tabindex="0" title="60일 기준 스프레드 표준화 값입니다. 음수가 클수록 삼성전자 상대 약세, SK하이닉스 상대 강세가 컸다는 의미입니다.">?</span></span>
          <strong id="spreadZ">-</strong>
          <small id="spreadRequired">-</small>
        </article>
        <article class="metric-card" title="삼성전자 1시간 롱 노출 대비 SK하이닉스 숏 노출 비율입니다.">
          <span class="label-line">1시간 헤지 h <span class="help" tabindex="0" title="SK하이닉스 숏 명목금액 / 삼성전자 롱 명목금액입니다. h가 높을수록 숏 레그 비중이 큽니다.">?</span></span>
          <strong id="actualHedge">-</strong>
          <small id="grossNotional">-</small>
        </article>
      </section>

      <section class="chart-grid">
        <article class="chart-panel">
          <div class="section-head">
            <h2 class="title-line">상대 가격 <span class="help" tabindex="0" title="두 종목의 가격을 같은 시작점으로 정규화해 상대 강약을 비교합니다.">?</span></h2>
            <span class="muted">정규화 종가</span>
          </div>
          <canvas id="priceChart"></canvas>
        </article>
        <article class="chart-panel">
          <div class="section-head">
            <h2 class="title-line">스프레드 타이밍 <span class="help" tabindex="0" title="전략 스프레드와 Z값을 같이 보여줍니다. Z값이 낮고 반전이 확인될 때 진입 후보가 됩니다.">?</span></h2>
            <span class="muted">가중 스프레드와 Z값</span>
          </div>
          <canvas id="spreadChart"></canvas>
        </article>
      </section>

      <section class="table-grid">
        <article class="panel">
          <div class="section-head">
            <h2 class="title-line">시장 데이터 <span class="help" tabindex="0" title="현재가, 일간 등락률, 시가총액, PBR을 비교합니다.">?</span></h2>
            <span class="muted" id="dataSource">-</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>종목</th>
                <th>현재가</th>
                <th>1일</th>
                <th>거래량</th>
                <th>거래대금</th>
                <th>시가총액</th>
                <th>PBR</th>
                <th>업데이트</th>
              </tr>
            </thead>
            <tbody id="marketRows"></tbody>
          </table>
        </article>

        <article class="panel">
          <div class="section-head">
            <h2 class="title-line">리스크 <span class="help" tabindex="0" title="가중 스프레드가 특정 폭으로 움직일 때 1시간 포지션의 추정 손익을 보여줍니다.">?</span></h2>
            <span class="muted" id="expiryInfo">-</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>스프레드 변화</th>
                <th>1시간 손익</th>
              </tr>
            </thead>
            <tbody id="stressRows"></tbody>
          </table>
        </article>
      </section>

      <section class="table-grid">
        <article class="panel wide-panel">
          <div class="section-head">
            <h2 class="title-line">컨센서스 스냅샷 <span class="help" tabindex="0" title="동일 날짜 기준 목표가 업사이드와 영업이익 수정률을 삼성전자와 SK하이닉스가 나란히 보이도록 정리합니다.">?</span></h2>
            <span class="muted" id="consensusDate">-</span>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>지표</th>
                  <th>삼성전자</th>
                  <th>SK하이닉스</th>
                  <th>비교/스프레드</th>
                </tr>
              </thead>
              <tbody id="consensusRows"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
