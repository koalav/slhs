<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>SHLS 간단 백테스트</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script defer src="assets/backtest.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>SHLS 간단 백테스트</h1>
        <p>언제, 어느 규모로 진입했을 때 현재까지 손익 확인</p>
      </div>
      <div class="status-strip">
        <a class="nav-link" href="index.html">대시보드</a>
        <a class="nav-link" href="base.html">기초자료</a>
        <a class="nav-link" href="research.html">리서치</a>
        <a class="nav-link" href="simulator.html">시뮬레이터</a>
        <span id="btGeneratedAt" class="muted">-</span>
      </div>
    </header>

    <main>
      <section class="summary-grid simulator-summary">
        <article class="metric-card">
          <span class="label-line">진입일 <span class="help" tabindex="0" title="선택한 날짜의 종가를 진입 가격으로 사용합니다.">?</span></span>
          <strong id="btEntryDate">-</strong>
          <small id="btExitDate">-</small>
        </article>
        <article class="metric-card">
          <span class="label-line">순손익 <span class="help" tabindex="0" title="진입일부터 최신 종가까지의 손익에서 추정 왕복 비용을 차감한 값입니다.">?</span></span>
          <strong id="btNetPnl">-</strong>
          <small id="btNetRoi">-</small>
        </article>
        <article class="metric-card">
          <span class="label-line">총 명목금액 <span class="help" tabindex="0" title="진입 시점 기준 삼성전자와 SK하이닉스 레그의 명목금액 합계입니다.">?</span></span>
          <strong id="btGrossNotional">-</strong>
          <small id="btCost">-</small>
        </article>
        <article class="metric-card">
          <span class="label-line">최대낙폭 <span class="help" tabindex="0" title="진입 이후 계좌 경로에서 고점 대비 가장 크게 하락한 비율입니다.">?</span></span>
          <strong id="btMdd">-</strong>
          <small id="btEndEquity">-</small>
        </article>
        <article class="metric-card">
          <span class="label-line">삼성 손익 <span class="help" tabindex="0" title="삼성전자 레그에서 발생한 손익입니다.">?</span></span>
          <strong id="btSamsungPnl">-</strong>
          <small id="btSamsungReturn">-</small>
        </article>
        <article class="metric-card">
          <span class="label-line">SK 손익 <span class="help" tabindex="0" title="SK하이닉스 레그에서 발생한 손익입니다. 페어 전략에서는 숏 손익입니다.">?</span></span>
          <strong id="btHynixPnl">-</strong>
          <small id="btHynixReturn">-</small>
        </article>
      </section>

      <section class="panel control-panel">
        <div class="section-head">
          <h2 class="title-line">백테스트 입력 <span class="help" tabindex="0" title="전략, 진입일, 계약 수, h, 비용을 바꾸면 그래프와 손익이 즉시 다시 계산됩니다.">?</span></h2>
          <span class="muted" id="btPeriod">-</span>
        </div>
        <div class="control-grid">
          <label>
            <span>전략</span>
            <select id="btStrategy">
              <option value="pair">삼성 롱 / SK 숏</option>
              <option value="samsung">삼성전자 단독 롱</option>
              <option value="hynix">SK하이닉스 단독 롱</option>
            </select>
          </label>
          <label>
            <span>진입일</span>
            <select id="btEntrySelect"></select>
          </label>
          <label>
            <span>계약 승수</span>
            <input id="btMultiplier" type="number" min="1" step="1" />
          </label>
          <label>
            <span>계좌 기준금액</span>
            <input id="btCapital" type="number" min="0" step="1000000" />
          </label>
          <label>
            <span>삼성전자 계약 수</span>
            <input id="btSamsungContracts" type="number" min="0" step="1" />
          </label>
          <label>
            <span>SK하이닉스 계약 수</span>
            <input id="btHynixContracts" type="number" min="0" step="1" />
          </label>
          <label>
            <span>페어 h</span>
            <input id="btH" type="number" min="0.2" max="1.4" step="0.01" />
          </label>
          <label>
            <span>수수료+슬리피지, 편도 bps</span>
            <input id="btCostBps" type="number" min="0" step="0.1" />
          </label>
        </div>
      </section>

      <section class="chart-grid">
        <article class="chart-panel wide-panel">
          <div class="section-head">
            <h2 class="title-line">손익 경로 <span class="help" tabindex="0" title="진입 이후 계좌 수익률과 낙폭을 함께 표시합니다.">?</span></h2>
            <span class="muted">계좌 수익률 / 낙폭</span>
          </div>
          <canvas id="btEquityChart"></canvas>
        </article>
      </section>

      <section class="table-grid">
        <article class="panel">
          <div class="section-head">
            <h2 class="title-line">거래 요약 <span class="help" tabindex="0" title="진입 가격, 현재 가격, 계약 수, 비용을 레그별로 확인합니다.">?</span></h2>
            <span class="muted">진입 종가 기준</span>
          </div>
          <dl id="btDetails" class="detail-list"></dl>
        </article>
        <article class="panel">
          <div class="section-head">
            <h2 class="title-line">성과 지표 <span class="help" tabindex="0" title="총손익, 순손익, 최대낙폭, 연율 변동성 등 기본 성과 지표입니다.">?</span></h2>
            <span class="muted">현재까지</span>
          </div>
          <dl id="btMetrics" class="detail-list"></dl>
        </article>
      </section>
    </main>
  </body>
</html>
